name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Exporter self-check (manifest patch and zip alignment on the real APK)
        run: |
          curl -sSL -o kotlin.zip https://github.com/JetBrains/kotlin/releases/download/v2.0.21/kotlin-compiler-2.0.21.zip
          unzip -q kotlin.zip -d "$HOME"
          "$HOME/kotlinc/bin/kotlinc" -nowarn app/src/main/java/com/nebula/studio/build/AxmlPatcher.kt app/src/main/java/com/nebula/studio/build/ZipAlign.kt tools/ExporterCheck.kt -include-runtime -d check.jar
          java -jar check.jar app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/patched.apk"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/aapt2" dump badging "$RUNNER_TEMP/patched.apk" | grep -E "^package:|application-label:|uses-permission: name='com.example"
          "$BT/aapt2" dump badging "$RUNNER_TEMP/patched.apk" | grep -q "package: name='com.example.testgame'"
          "$BT/aapt2" dump badging "$RUNNER_TEMP/patched.apk" | grep -q "application-label:'Test Game Label'"
          # nothing derived from the editor's package id may remain (provider authorities clash on install); only the class name is allowed
          "$BT/aapt2" dump xmltree --file AndroidManifest.xml "$RUNNER_TEMP/patched.apk" > "$RUNNER_TEMP/manifest.txt"
          grep -o 'com\.nebula\.studio[^"]*' "$RUNNER_TEMP/manifest.txt" | sort -u
          ! grep -o 'com\.nebula\.studio[^" ]*' "$RUNNER_TEMP/manifest.txt" | grep -v '^com\.nebula\.studio\.MainActivity$'
          grep -q 'authorities.*com.example.testgame.androidx-startup' "$RUNNER_TEMP/manifest.txt" && echo "provider authority patched"
          "$BT/zipalign" -c 4 "$RUNNER_TEMP/patched.apk" && echo "zip alignment OK"
      - uses: actions/upload-artifact@v4
        with:
          name: nebula-debug-apk
          path: app/build/outputs/apk/debug/*.apk

  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install Kotlin compiler
        run: |
          curl -sSL -o kotlin.zip https://github.com/JetBrains/kotlin/releases/download/v2.0.21/kotlin-compiler-2.0.21.zip
          unzip -q kotlin.zip -d "$HOME"
      - name: Build SuperNova compiler
        run: |
          git clone --depth 1 https://github.com/Imbluubyte/SuperNova "$HOME/SuperNova"
          cd "$HOME/SuperNova/compiler" && cargo build --release
      - name: Core tests (transpiler, scene, engine, starter project through snc)
        run: |
          export KOTLINC="$HOME/kotlinc/bin/kotlinc" SNC="$HOME/SuperNova/compiler/target/release/snc"
          sh tests/run-core.sh && sh tests/run-native.sh
