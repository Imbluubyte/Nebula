name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: nebula-debug-apk
          path: app/build/outputs/apk/debug/*.apk

  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install Kotlin compiler
        run: |
          curl -sSL -o kotlin.zip https://github.com/JetBrains/kotlin/releases/download/v2.0.21/kotlin-compiler-2.0.21.zip
          unzip -q kotlin.zip -d "$HOME"
      - name: Build SuperNova compiler
        run: |
          git clone --depth 1 https://github.com/Imbluubyte/SuperNova "$HOME/SuperNova"
          cd "$HOME/SuperNova/compiler" && cargo build --release
      - name: Core tests (transpiler, scene, engine, starter project through snc)
        run: |
          export KOTLINC="$HOME/kotlinc/bin/kotlinc" SNC="$HOME/SuperNova/compiler/target/release/snc"
          sh tests/run-core.sh && sh tests/run-native.sh
